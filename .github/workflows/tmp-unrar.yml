name: tmp unpack cheat collection (one-time)
on:
  push:
    branches: [tmp-unrar-cheats]
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          git clone --depth 1 https://github.com/xGamingDragon93x/PCSX2-Ultimative-Cheats-Collection-PNACH src
          mkdir out
          7z x -oout "src/PCSX2 Cheats Ultimative Cheats Collection.rar" > /dev/null
          find out -type f | head -20
          find out -type f | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: ultimative-cheats
          path: out
