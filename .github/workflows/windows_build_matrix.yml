name: 🖥️ Windows Builds
# xbox build
on:
  push:
    branches-ignore:
      - "l10n_master"
  pull_request:
    branches:
      - master

jobs:
  # MSBUILD
  lint_vs_proj_files:
    name: Lint VS Project Files
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Verify VS Project Files
        run: .github\workflows\scripts\windows\validate-vs-filters.ps1

  build_qt_sse4:
    if: false
    needs: lint_vs_proj_files
    name: "SSE4"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "MSVC SSE4"
      artifactPrefixName: "PCSX2-windows-Qt-x64-sse4-msvc"
      configuration: Release
      simd: "SSE4"
    secrets: inherit

  build_qt_avx2:
    if: false
    needs: lint_vs_proj_files
    name: "AVX2"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "MSVC AVX2"
      artifactPrefixName: "PCSX2-windows-Qt-x64-avx2-msvc"
      configuration: Release AVX2
    secrets: inherit

  build_qt_cmake:
    if: false
    name: "CMake"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake MSVC"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-msvc"
      configuration: CMake
      buildSystem: cmake
    secrets: inherit

  build_qt_clang_sse4:
    if: false
    needs: lint_vs_proj_files
    name: "SSE4"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "Clang SSE4"
      artifactPrefixName: "PCSX2-windows-Qt-x64-sse4-clang"
      configuration: Release Clang
      simd: "SSE4"
    secrets: inherit

  build_qt_clang_avx2:
    if: false
    needs: lint_vs_proj_files
    name: "AVX2"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "Clang AVX2"
      artifactPrefixName: "PCSX2-windows-Qt-x64-avx2-clang"
      configuration: Release Clang AVX2
    secrets: inherit

  build_qt_cmake_clang:
    if: false
    name: "CMake"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake Clang"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-clang"
      configuration: CMake
      buildSystem: cmake
      cmakeFlags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DPCSX2_EXE_NAME=pcsx2-qt-clang
    secrets: inherit

  # UWP MSBuild
  build_uwp_release:
    needs: lint_vs_proj_files
    name: "UWP Release"
    if: github.repository == 'XboxEmulationHub/XBSX2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/windows_build_uwp.yml
    with:
      jobName: "UWP Release"
      artifactPrefixName: "XBSX2-windows-uwp-x64-release"
      configuration: Release
      simd: "SSE4"
    secrets: inherit

  build_uwp_avx2:
    needs: lint_vs_proj_files
    name: "UWP AVX2"
    if: true
    uses: ./.github/workflows/windows_build_uwp.yml
    with:
      jobName: "UWP AVX2"
      artifactPrefixName: "XBSX2-windows-uwp-x64-avx2"
      configuration: Release AVX2
    secrets: inherit

  # Frank's Xbox build: the install files on a fixed "latest" release, ready to download
  publish_latest:
    needs: build_uwp_avx2
    name: "Publish latest Xbox build"
    if: github.repository == 'pieceofadream1116-hub/XBSX2' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download install files
        uses: actions/download-artifact@v4
        with:
          pattern: XBSX2-windows-uwp-x64-avx2-*
          path: artifact

      - name: Pick the Xbox install files
        run: |
          mkdir -p dist
          find artifact -path '*symbols*' -prune -o -type f \( -iname '*.msix' -o -iname '*.msixbundle' -o -iname '*.appx' -o -iname '*.appxbundle' -o -iname '*.cer' \) -print | while read -r f; do
            case "$f" in
              */Dependencies/*) case "$f" in */x64/*) cp "$f" dist/ ;; esac ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -la dist
          test -n "$(ls dist)"

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="PS2 for Xbox (XBSX2), latest build of commit ${GITHUB_SHA::7}.
          On the Xbox Device Portal, add the XBSX2 package, and add the Microsoft.VCLibs .appx file as its dependency."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS2 (latest build)" --notes "$notes"
